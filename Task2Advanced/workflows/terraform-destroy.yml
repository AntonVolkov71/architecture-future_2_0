name: Terraform Destroy

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      ENV: dev
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_token: ${{ secrets.YC_TOKEN }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: Task2Advanced/modules/vm

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config=../../envs/$ENV/backend.hcl

      - run: terraform destroy -auto-approve -var-file=../../envs/$ENV/terraform.tfvars