version: '3.8'

services:
  backend:
    build:
      context: ./the-backend-s3
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      APP_S3_ENDPOINT: http://minio:9000
      APP_S3_BUCKET: test-terraform
      APP_S3_ACCESS_KEY: minio_user
      APP_S3_SECRET_KEY: minio_password
    networks:
      - ainane-network

  minio:
    image: minio/minio
    ports:
      - "9010:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    command: server --console-address ":9001" /data
    networks:
      - ainane-network

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: /bin/sh -c
    command: >
      "sleep 5;
       until mc alias set local http://minio:9000 minio_user minio_password;
       mc anonymous set download local/test-terraform;"
    networks:
      - ainane-network

volumes:
  minio_storage: { }

networks:
  ainane-network:
    name: ainane-network
    driver: bridge